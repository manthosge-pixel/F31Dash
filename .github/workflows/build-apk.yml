name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk F31Dash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: F31Dash-apk
          path: F31Dash.apk

      - name: Publish as "latest" release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: F31 Dash (latest build)
          body: "Automatic build of commit ${{ github.sha }}"
          files: F31Dash.apk
          make_latest: true
          prerelease: false
