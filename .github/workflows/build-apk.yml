name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          base=$(grep -oP 'val baseVersion = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$base.${{ github.run_number }}" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk F31Dash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: F31Dash-apk
          path: F31Dash.apk

      # One release per build (v0.29.N). The app's UPDATES button reads releases/latest.
      # The file name stays F31Dash.apk, so .../releases/latest/download/F31Dash.apk always works.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: F31 Dash ${{ env.VER }}
          body: ${{ github.event.head_commit.message }}
          files: F31Dash.apk
          make_latest: true
          prerelease: false
